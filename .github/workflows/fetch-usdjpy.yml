name: Fetch USDJPY 5-minute data

on:
  schedule:
    - cron: "0 21 * * *"  # 21:00 UTC = 06:00 JST (Coworkルーティンの07:30 JST実行の1.5時間前)
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -q yfinance pandas numpy tzdata

      - name: Fetch previous JST day's 5-minute data
        run: python3 fetch_usdjpy_5min.py

      - name: Commit and push if data was produced
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -f output/*.csv
          if git diff --staged --quiet; then
            echo "No new data to commit (holiday/weekend or already up to date)."
          else
            git commit -m "Add USDJPY 5-min data $(date -u +%Y-%m-%d)"
            git push
          fi
